[package]
name = "subspace"
version = "0.1.0"
edition = "2021"
description = "AI coding agent swarm orchestrator via tmux"
license = "MPL-2.0"

[[bin]]
name = "subspace"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"

[profile.release]
strip = true
lto = true
