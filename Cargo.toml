[package]
name = "subspace"
version = "0.1.0"
edition = "2021"
description = "AI coding agent swarm orchestrator via tmux"
license = "MPL-2.0"

[[bin]]
name = "subspace"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
agent-client-protocol = { version = "0.9", features = ["unstable"] }
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
futures = "0.3"

[profile.release]
strip = true
lto = true
